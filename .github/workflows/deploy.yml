name: deptic-ec2-docker-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic
  EC2_INSTANCE_ID: i-0edfdb0e7a6bdcda7
  PUBLIC_URL: http://3.7.135.174
  CONTAINER_PORT: 80
  DOCKER_CONTEXT: .

jobs:
  build:
    name: Build diagnostics and Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (apps/api diagnostics)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/api/go.sum

      - name: Setup Node (apps/web + cli diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build diagnostics - repository layout
        run: |
          echo "=== Repository layout ==="
          ls -la
          echo "=== apps/api ==="
          ls -la apps/api || true
          echo "=== apps/web ==="
          ls -la apps/web || true
          echo "=== cli ==="
          ls -la cli || true
          echo "=== docker-compose services ==="
          cat docker-compose.yml

      - name: Build diagnostics - Go API module
        working-directory: apps/api
        run: |
          go version
          go env GOVERSION GOPATH GOMODCACHE
          echo "=== go.mod ==="
          cat go.mod
          echo "=== go mod verify (dependency graph) ==="
          go mod download -x 2>&1 | tail -n 5 || true
          echo "=== vet cmd/server ==="
          go vet ./cmd/server || true

      - name: Build diagnostics - Web frontend manifest
        working-directory: apps/web
        run: |
          node --version
          npm --version
          echo "=== package.json ==="
          cat package.json
          echo "=== next version declared ==="
          node -e "console.log('next:', require('./package.json').dependencies.next)"

      - name: Build diagnostics - CLI manifest
        run: |
          echo "=== cli/package.json ==="
          cat cli/package.json
          echo "=== cli smoke (syntax check) ==="
          node --check cli/index.js && echo "cli/index.js syntax OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE_TAG="${GITHUB_RUN_ID}-${SHORT_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:${IMAGE_TAG}"
          {
            echo "image_tag=${IMAGE_TAG}"
            echo "image_uri=${FULL_IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"
          echo "Resolved image URI: ${FULL_IMAGE}"

      - name: Build Docker image (context ., port 80 per contract)
        run: |
          docker build \
            -t "${FULL_IMAGE}" \
            -t "${ECR_REPOSITORY_URI}:latest" \
            -f Dockerfile \
            "${DOCKER_CONTEXT}"
          echo "=== built image ==="
          docker images "${ECR_REPOSITORY_URI}"

      - name: Export image artifact for deploy job
        run: |
          docker save "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" | gzip > /tmp/deptic-image.tar.gz
          ls -la /tmp/deptic-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: deptic-image
          path: /tmp/deptic-image.tar.gz
          retention-days: 1

  deploy:
    name: Push to ECR and deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      IMAGE_URI: ${{ needs.build.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: deptic-image
          path: /tmp

      - name: Load image and authenticate to ECR (AWS CLI, static credentials)
        run: |
          docker load < /tmp/deptic-image.tar.gz
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "Logged in to $ECR_REGISTRY"

      - name: Push image to ECR
        run: |
          docker push "${IMAGE_URI}"
          docker push "${ECR_REPOSITORY_URI}:latest"
          echo "Pushed ${IMAGE_URI} and :latest"

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic:${IMAGE_TAG}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          echo "=== ssm-params.json ==="
          cat /tmp/ssm-params.json

      - name: Deploy to EC2 instance via SSM send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "::error::SSM send-command failed to return a CommandId"
            exit 1
          fi

      - name: Wait for SSM command completion
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
          echo "SSM command completed"

      - name: Verify SSM command success and print output
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" --output text)
          echo "SSM status: ${STATUS}"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text || true
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command ended with status ${STATUS}"
            exit 1
          fi

  verify:
    name: Verify production health over HTTP 200
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check http://3.7.135.174 (must return HTTP 200)
        run: |
          URL="http://3.7.135.174"
          echo "Polling ${URL} for HTTP 200 ..."
          ATTEMPTS=30
          for i in $(seq 1 $ATTEMPTS); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "${URL}" || true)
            echo "Attempt ${i}/${ATTEMPTS}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "=== response body ==="
              cat /tmp/health-body || true
              echo "HEALTH CHECK PASSED: HTTP 200 from ${URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check failed: no HTTP 200 from ${URL} after ${ATTEMPTS} attempts"
          exit 1

      - name: Final deployment summary
        run: |
          {
            echo "## DEPTIC deployment verified"
            echo "- target: EC2_DOCKER (ap-south-1)"
            echo "- instance: i-0edfdb0e7a6bdcda7"
            echo "- image: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic"
            echo "- public URL: http://3.7.135.174 (HTTP 200)"
          } >> "$GITHUB_STEP_SUMMARY"