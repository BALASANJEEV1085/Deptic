      - name: Wait for SSM Agent & Deploy to EC2
        if: ${{ env.INSTANCE_ID != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e

          echo "==> Waiting for SSM agent to come online on $INSTANCE_ID..."

          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || echo "NotReady")

            echo "SSM ping: $PING ($i/30)"

            if [ "$PING" = "Online" ]; then
              break
            fi

            if [ "$i" = "30" ]; then
              echo "ERROR: SSM agent did not come online."
              exit 1
            fi

            sleep 10
          done

          echo "==> Getting ECR password..."

          ECR_PASSWORD=$(aws ecr get-login-password \
            --region "$AWS_REGION")

          echo "==> Sending deployment command to EC2 instance $INSTANCE_ID..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $ECR_REPOSITORY:latest" \
            --parameters "commands=[
              \"until command -v docker > /dev/null 2>&1; do echo 'Waiting for docker...'; sleep 5; done\",
              \"echo '$ECR_PASSWORD' | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest\",
              \"docker stop app 2>/dev/null || true\",
              \"docker rm app 2>/dev/null || true\",
              \"aws secretsmanager get-secret-value --region $AWS_REGION --secret-id deptic/Deptic/secrets --query SecretString --output text > /tmp/deptic-secret.json\",
              \"python3 -c 'import json; d=json.load(open(\\\"/tmp/deptic-secret.json\\\")); open(\\\"/home/ubuntu/app.env\\\",\\\"w\\\").write(\\\"\\\\n\\\".join(f\\\"{k}={v}\\\" for k,v in d.items()))'\",
              \"docker run -d --restart always -p 80:80 --env-file /home/ubuntu/app.env --name app $ECR_REGISTRY/$ECR_REPOSITORY:latest\"
            ]" \
            --output text \
            --query 'Command.CommandId')

          echo "SSM CommandId: $COMMAND_ID"

          echo "==> Polling for completion..."

          for i in $(seq 1 24); do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Status [$i/24]: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed."

              echo "===== STDOUT ====="

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text || true

              echo "===== STDERR ====="

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text || true

              exit 1
            fi

            sleep 10
          done

          echo "ERROR: Timeout waiting for SSM command."
          exit 1
