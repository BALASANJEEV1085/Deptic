name: deptic-ec2-docker-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic
  EC2_INSTANCE_ID: i-0edfdb0e7a6bdcda7
  PUBLIC_URL: http://3.7.135.174
  CONTAINER_PORT: 80
  SECRETS_MANAGER_ID: deptic/Deptic/secrets

jobs:
  build-push-deploy-verify:
    name: Build, push, deploy and verify on EC2 (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static creds from secrets)
        run: |
          mkdir -p "$HOME/.aws"
          {
            echo "[default]"
            echo "aws_access_key_id=${AWS_ACCESS_KEY_ID}"
            echo "aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}"
          } > "$HOME/.aws/credentials"
          {
            echo "[default]"
            echo "region=${AWS_REGION}"
            echo "output=json"
          } > "$HOME/.aws/config"
          aws sts get-caller-identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up Go toolchain for API build diagnostics
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node.js toolchain for web/CLI diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build diagnostics - repository topology
        run: |
          set -euxo pipefail
          echo "--- repo root ---"
          ls -la
          echo "--- apps/api ---"
          ls -la apps/api || true
          echo "--- apps/web ---"
          ls -la apps/web || true
          echo "--- detected container port ---"
          echo "CONTAINER_PORT=${CONTAINER_PORT}"
          echo "--- deployment target ---"
          echo "ECR=${ECR_REPOSITORY_URI} INSTANCE=${EC2_INSTANCE_ID} REGION=${AWS_REGION}"

      - name: Build diagnostics - Go API vet and build
        working-directory: apps/api
        run: |
          set -euxo pipefail
          go version
          go mod download
          go vet ./... || true
          go build -o /tmp/deptic-api-server ./cmd/server
          ls -la /tmp/deptic-api-server

      - name: Build diagnostics - web and CLI manifest checks
        run: |
          set -euxo pipefail
          node --version
          test -f apps/web/package.json
          test -f cli/package.json
          test -f docker-compose.yml
          node -e "const p=require('./apps/web/package.json'); console.log('web name:', p.name, 'next:', p.dependencies.next)"
          node -e "const p=require('./cli/package.json'); console.log('cli name:', p.name, 'version:', p.version)"

      - name: Login to Amazon ECR (direct AWS CLI)
        run: |
          set -euxo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          echo "ECR_REGISTRY=${ECR_REGISTRY}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image (repo-root context, port 80)
        run: |
          set -euxo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${SHORT_SHA}"
          LATEST_URI="${ECR_REPOSITORY_URI}:latest"
          docker buildx build \
            --file Dockerfile \
            --context . \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_URI" \
            --push \
            --provenance=false \
            --sbom=false
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Pushed ${IMAGE_URI} and ${LATEST_URI}"

      - name: Deploy to EC2 instance via SSM send-command
        run: |
          set -euxo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euxo pipefail",
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic:latest",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          while true; do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "CommandInvocations[0].Status" --output text)
            echo "SSM status: ${STATUS}"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status ${STATUS}"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true; exit 1 ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"

      - name: Verify deployment - health check must return HTTP 200
        run: |
          set -euxo pipefail
          HEALTH_URL="${PUBLIC_URL}/health"
          echo "Checking ${HEALTH_URL}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w '%{http_code}' "${HEALTH_URL}" || true)
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health-body || true
              echo "HEALTH CHECK PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1