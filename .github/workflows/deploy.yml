name: Deploy to AWS ECS

on:
  push:
    branches: [main, master]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: deptic
  ECS_CLUSTER: deptic-cluster
  ECS_SERVICE: deptic-service
  CONTAINER_NAME: deptic

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          IMAGE_TAG=$GITHUB_SHA
          FULL_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY

          echo "Building image: $FULL_IMAGE:$IMAGE_TAG"
          docker build \
            --tag "$FULL_IMAGE:$IMAGE_TAG" \
            --tag "$FULL_IMAGE:latest" \
            . 2>&1

          echo "Pushing $FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

          echo "image=$FULL_IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $CONTAINER_NAME \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
