name: Build & Deploy to EC2 Docker

on:
  push:
    branches: [main, master]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: deptic
  INSTANCE_ID: i-04a1e9ce6c827ed66

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          IMAGE_TAG=$GITHUB_SHA
          FULL_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY

          echo "Building Docker image: $FULL_IMAGE:$IMAGE_TAG"
          docker build \
            --tag "$FULL_IMAGE:$IMAGE_TAG" \
            --tag "$FULL_IMAGE:latest" \
            --label "git-sha=$GITHUB_SHA" \
            .

          echo "Pushing images to ECR..."
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via AWS SSM
        if: env.INSTANCE_ID != ''
        run: |
          echo "Triggering SSM remote command on EC2 instance $INSTANCE_ID..."
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest container" \
            --parameters commands="[
              \"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}\",
              \"docker pull ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest\",
              \"docker stop app 2>/dev/null || true\",
              \"docker rm app 2>/dev/null || true\",
              \"docker run -d --restart always -p 80:80 --name app ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest\"
            ]"
