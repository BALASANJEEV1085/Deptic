name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image
        run: |
          IMAGE_REPO=${{ secrets.ECR_REPO }}
          IMAGE_TAG=${{ github.sha }}
          docker build -t $IMAGE_REPO:$IMAGE_TAG .
          docker push $IMAGE_REPO:$IMAGE_TAG
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Stop and remove old container on EC2
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=deptic-app" \
            --parameters commands="docker rm -f app || true"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Run new container on EC2
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=deptic-app" \
            --parameters commands="docker run -d --name app --restart unless-stopped -p 8081:8081 -p 3000:3000 ${{ secrets.ECR_REPO }}:${{ github.sha }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
