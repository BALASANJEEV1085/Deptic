name: Deploy Deptic to AWS ECS

on:
  push:
    branches: [main, master]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: deptic
  ECS_CLUSTER: deptic-cluster
  ECS_SERVICE: deptic-service

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          echo "Building: $FULL_IMAGE:$GITHUB_SHA"
          docker build \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            . 2>&1
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "image=$FULL_IMAGE:$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE
