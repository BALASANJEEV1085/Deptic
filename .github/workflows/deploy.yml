name: Deploy to EC2 (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: deptic
  INSTANCE_ID: i-0693c5becfd991083
  PUBLIC_URL: http://15.252.26.151

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for web)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go (for api)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region $REGION

      - name: Build and tag Docker images
        run: |
          # Build API image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:api-latest ./apps/api
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:api-latest $ECR_REGISTRY/$ECR_REPOSITORY:api-${{ github.sha }}

          # Build Web image (uses root context but Dockerfile is at apps/web)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:web-latest ./apps/web
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:web-latest $ECR_REGISTRY/$ECR_REPOSITORY:web-${{ github.sha }}

      - name: Push images to ECR
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:api-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:api-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:web-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:web-${{ github.sha }}

      - name: Deploy via SSM on EC2
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $ECR_REGISTRY/$ECR_REPOSITORY:api-latest",
              "docker pull $ECR_REGISTRY/$ECR_REPOSITORY:web-latest",
              "docker stop api web 2>/dev/null || true",
              "docker rm api web 2>/dev/null || true",
              "docker run -d --restart always -p 8081:8081 --name api $ECR_REGISTRY/$ECR_REPOSITORY:api-latest",
              "docker run -d --restart always -p 3000:3000 --name web $ECR_REGISTRY/$ECR_REPOSITORY:web-latest"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
          # Wait for command to complete
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"

      - name: Health check (web app)
        run: |
          echo "Waiting for services to become healthy..."
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://15.252.26.151 || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed (HTTP 200)"
          else
            echo "Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Health check (API)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://15.252.26.151:8081/health || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "API health check passed (HTTP 200)"
          else
            echo "API health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi