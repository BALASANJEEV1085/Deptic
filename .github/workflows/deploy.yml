name: deptic-ec2-docker-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic
  EC2_INSTANCE_ID: i-0edfdb0e7a6bdcda7
  PUBLIC_URL: http://3.7.135.174
  CONTAINER_PORT: 80
  SECRETS_MANAGER_ID: deptic/Deptic/secrets

jobs:
  build-and-verify:
    name: Build diagnostics and verify apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build diagnostics - repository topology
        run: |
          echo "=== Repository topology ==="
          ls -la
          echo "=== apps/api ==="
          ls -la apps/api || true
          echo "=== apps/web ==="
          ls -la apps/web || true
          echo "=== cli ==="
          ls -la cli || true
          echo "=== docker-compose ==="
          cat docker-compose.yml || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Go build diagnostics (apps/api)
        working-directory: apps/api
        run: |
          go version
          go env GOVERSION GOPATH GOMODCACHE
          go mod download
          go vet ./... || echo "go vet reported issues (non-fatal diagnostics)"
          go build -o /tmp/server ./cmd/server
          echo "API binary built:"
          ls -la /tmp/server

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node build diagnostics (apps/web)
        working-directory: apps/web
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build || echo "next build reported issues (non-fatal diagnostics)"

      - name: CLI syntax check (cli/index.js)
        run: |
          node --version
          node --check cli/index.js && echo "cli/index.js syntax OK"

  deploy:
    name: Build image, push to ECR, deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static env)
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS static credentials missing - ensure AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are set on the runner"
            exit 1
          fi
          aws --version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: image
        run: |
          ECR_REGISTRY="759204735992.dkr.ecr.ap-south-1.amazonaws.com"
          ECR_REPOSITORY="deptic"
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: ECR login (AWS CLI)
        run: |
          REGION="$AWS_REGION"
          ECR_REGISTRY="${{ steps.image.outputs.registry }}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1

      - name: Build Docker image (repository root context, port 80)
        run: |
          IMAGE_URI="${{ steps.image.outputs.image }}"
          LATEST_URI="${{ steps.image.outputs.latest }}"
          echo "Building image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" -f Dockerfile .
          docker images

      - name: Push Docker image to ECR
        run: |
          IMAGE_URI="${{ steps.image.outputs.image }}"
          LATEST_URI="${{ steps.image.outputs.latest }}"
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Write SSM command payload to file
        run: |
          IMAGE_URI="${{ steps.image.outputs.image }}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=__IMAGE_URI__",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json

      - name: Send deployment command via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $COMMAND_ID"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1

      - name: Wait for SSM command success
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment command succeeded"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment command failed"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM command"
          exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1

  verify:
    name: Health check public endpoint
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for service rollout
        run: sleep 20

      - name: Health check http://3.7.135.174 (must return HTTP 200)
        run: |
          URL="http://3.7.135.174"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed"
              cat /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed - service did not return HTTP 200"
          exit 1