name: deptic-ec2-docker-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic
  EC2_INSTANCE_ID: i-0edfdb0e7a6bdcda7
  PUBLIC_URL: http://3.7.135.174
  CONTAINER_PORT: 80
  DOCKER_CONTEXT: .

jobs:
  build:
    name: Build diagnostics and Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (apps/api toolchain per go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Go build diagnostics (apps/api)
        working-directory: apps/api
        run: |
          set -euo pipefail
          go version
          go env GOVERSION GOOS GOARCH
          go build ./... && echo "GO_BUILD_OK"

      - name: Setup Node (apps/web + cli toolchain per package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node build diagnostics (apps/web)
        working-directory: apps/web
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package.json && echo "WEB_PACKAGE_OK"

      - name: CLI sanity diagnostics (cli/)
        run: |
          set -euo pipefail
          node --check cli/index.js && echo "CLI_SYNTAX_OK"
          test -f cli/package.json && echo "CLI_PACKAGE_OK"

      - name: Show deployment topology evidence
        run: |
          set -euo pipefail
          test -f docker-compose.yml && echo "COMPOSE_PRESENT"
          test -f apps/api/Dockerfile && echo "API_DOCKERFILE_PRESENT"
          echo "Context=$DOCKER_CONTEXT Port=$CONTAINER_PORT"

      - name: Configure AWS credentials (static credentials, direct CLI)
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "$AWS_REGION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and ECR login (direct AWS CLI)
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image (repo-root context, exposes 80)
        run: |
          set -euo pipefail
          FULL_IMAGE="$ECR_REPOSITORY_URI:${{ steps.meta.outputs.image_tag }}"
          docker build -t "$FULL_IMAGE" -t "$ECR_REPOSITORY_URI:latest" "$DOCKER_CONTEXT"
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "PUSHED_IMAGE=$FULL_IMAGE"

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static credentials, direct CLI)
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "$AWS_REGION"

      - name: Write SSM command payload to file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic:${{ needs.build.outputs.image_tag }}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: status=$STATUS"
            case "$STATUS" in
              Success) echo "SSM_COMMAND_SUCCESS"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status: $STATUS"; exit 1 ;;
            esac
          done
          echo "SSM command timed out"; exit 1

  verify:
    name: Verify production health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (must return HTTP 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "${PUBLIC_URL}/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "HEALTH_CHECK_OK"
              head -c 500 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check never returned 200"; exit 1