name: deptic-ec2-docker-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic
  EC2_INSTANCE_ID: i-0edfdb0e7a6bdcda7
  PUBLIC_URL: http://3.7.135.174
  CONTAINER_PORT: 80
  SECRETS_MANAGER_ID: deptic/Deptic/secrets

jobs:
  build-push-deploy:
    name: Build, push to ECR, deploy to EC2, verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static creds from Secrets Manager secret)
        run: |
          set -euo pipefail
          CREDS_JSON=$(curl -sS --fail-with-body \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets/AWS_CREDS")
          echo "::add-mask::$CREDS_JSON"
          echo "$CREDS_JSON" | jq -r '.value' > /tmp/awscreds.b64
          DECODED=$(base64 -d /tmp/awscreds.b64)
          echo "::add-mask::$DECODED"
          AWS_ACCESS_KEY_ID=$(echo "$DECODED" | jq -r '.aws_access_key_id')
          AWS_SECRET_ACCESS_KEY=$(echo "$DECODED" | jq -r '.aws_secret_access_key')
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_DEFAULT_REGION=$AWS_REGION"
          } >> "$GITHUB_ENV"
          rm -f /tmp/awscreds.b64

      - name: Build diagnostics - repository topology
        run: |
          set -euo pipefail
          echo "== Repository root =="
          ls -la
          echo "== apps/api (Go API, Dockerfile context) =="
          ls -la apps/api || true
          echo "== docker-compose services =="
          grep -A2 'build:' docker-compose.yml || true
          echo "== Detected container port (contract): $CONTAINER_PORT =="
          echo "== Go module =="
          head -n 3 apps/api/go.mod
          echo "== API entrypoint =="
          ls -la apps/api/cmd/server/main.go

      - name: Set up Go (matches go.mod 1.26.x)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/api/go.sum

      - name: Build diagnostics - compile API and vet
        working-directory: apps/api
        run: |
          set -euo pipefail
          go version
          go build ./...
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and full image URI
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$SHORT_SHA"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=$LATEST_IMAGE" >> "$GITHUB_ENV"
          echo "Registry: $ECR_REGISTRY"
          echo "Image: $FULL_IMAGE"

      - name: ECR login (direct AWS CLI)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context apps/api, port 80)
        run: |
          set -euo pipefail
          docker build \
            -t "$FULL_IMAGE" \
            -t "$LATEST_IMAGE" \
            -f apps/api/Dockerfile \
            apps/api
          docker images "$ECR_REGISTRY/deptic"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"

      - name: Write SSM command payload to JSON file
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic:latest",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          jq . /tmp/ssm-params.json

      - name: Deploy to EC2 via SSM send-command
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "attempt=$i status=$STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SSM command succeeded"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true
              exit 1
            fi
            sleep 5
          done
          echo "SSM command timed out"
          exit 1

      - name: Post-deploy health check (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="$PUBLIC_URL/health"
          echo "Probing $HEALTH_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || true)
            echo "attempt=$i http_code=$CODE body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: never received HTTP 200 from $HEALTH_URL"
          exit 1