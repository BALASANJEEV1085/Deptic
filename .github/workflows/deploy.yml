```yaml
name: Build and Deploy Deptic to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: deptic
  INSTANCE_ID: i-06ddef92875a86709
  CONTAINER_NAME: deptic
  HOST_PORT: 80
  API_PORT: 8081
  WEB_PORT: 3000

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # AWS credentials
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # ECR login
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------
      # Build and push image
      #
      # IMPORTANT:
      # Root Dockerfile builds BOTH:
      #   - Go API  -> 8081
      #   - Next.js -> 3000
      # ---------------------------------------------------------
      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          TAG="$GITHUB_SHA"

          echo "Building $IMAGE:$TAG"

          docker build \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            .

          echo "Pushing $IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

          echo "Pushing $IMAGE:latest"
          docker push "$IMAGE:latest"

          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Wait for EC2 SSM
      # ---------------------------------------------------------
      - name: Wait for EC2 SSM
        run: |
          set -e

          echo "Waiting for SSM agent on ${{ env.INSTANCE_ID }}..."

          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --region "${AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)

            echo "SSM status [$i/30]: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "SSM is online."
              exit 0
            fi

            sleep 10
          done

          echo "SSM agent did not become online."
          exit 1

      # ---------------------------------------------------------
      # Deploy to EC2 using SSM
      # ---------------------------------------------------------
      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          SECRET_ID="deptic/Deptic/secrets"

          cat > /tmp/ssm-params.json << EOF
          {
            "commands": [
              "set -e",

              "echo '==> Starting Docker...'",
              "systemctl start docker || service docker start || true",
              "until docker info >/dev/null 2>&1; do sleep 2; done",

              "echo '==> Logging in to ECR...'",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",

              "echo '==> Pulling image ${IMAGE}...'",
              "docker pull ${IMAGE}",

              "echo '==> Fetching secrets...'",
              "aws secretsmanager get-secret-value --region ${AWS_REGION} --secret-id ${SECRET_ID} --query SecretString --output text | python3 -c 'import sys,json; d=json.load(sys.stdin); print(\"\\n\".join(f\"{k}={v}\" for k,v in d.items()))' > /home/ubuntu/deptic.env",

              "chmod 600 /home/ubuntu/deptic.env",

              "echo '==> Removing old container...'",
              "docker stop ${CONTAINER_NAME} 2>/dev/null || true",
              "docker rm ${CONTAINER_NAME} 2>/dev/null || true",

              "echo '==> Starting new container...'",
              "docker run -d --restart unless-stopped --name ${CONTAINER_NAME} -p ${HOST_PORT}:3000 -p ${API_PORT}:${API_PORT} --env-file /home/ubuntu/deptic.env -e HOSTNAME=0.0.0.0 ${IMAGE}",

              "echo '==> Waiting for application...'",
              "sleep 10",

              "echo '==> Container status:'",
              "docker ps --filter name=${CONTAINER_NAME}",

              "echo '==> Checking API health...'",
              "curl -fsS http://127.0.0.1:${API_PORT}/health",

              "echo '==> Checking web service...'",
              "curl -fsS http://127.0.0.1:${WEB_PORT}/",

              "echo '==> Deployment successful.'"
            ]
          }
          EOF

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --comment "Deploy Deptic ${GITHUB_SHA}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 36); do
            sleep 5

            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "$COMMAND_ID" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status [$i/36]: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "Deployment failed."

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM."
          exit 1
```
