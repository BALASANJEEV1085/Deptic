name: Deploy EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  INSTANCE_ID: i-0693c5becfd991083
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: deptic
  SECRETS_ID: deptic/Deptic/secrets
  DEPLOY_PATH: /home/ec2-user/app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build API binary (pre-check)
        run: |
          cd apps/api
          go build -o /dev/null ./cmd/server
          echo "API build succeeded"

      - name: Build web app (pre-check)
        run: |
          cd apps/web
          npm ci --legacy-peer-deps
          npm run build
          echo "Web build succeeded"

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'EOF'
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config << 'EOF'
          [default]
          region = ${{ env.REGION }}
          output = json
          EOF

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$(echo ${{ github.sha }} | head -c 7)"
          FULL_IMAGE="${IMAGE_URI}"
          docker build -t $FULL_IMAGE -f Dockerfile .
          docker push $FULL_IMAGE
          echo "Pushed ${FULL_IMAGE}"

      - name: Deploy via SSM
        run: |
          COMMIT_HASH=$(echo ${{ github.sha }} | head -c 7)
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${COMMIT_HASH}"

          # Write the SSM parameters to a file to avoid shell interpolation issues
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          # Replace literal $REGION in the JSON with actual region
          sed -i "s/\$REGION/${{ env.REGION }}/g" /tmp/ssm-params.json
          sed -i "s|\$ECR_REGISTRY|${{ env.ECR_REGISTRY }}|g" /tmp/ssm-params.json
          sed -i "s|\$IMAGE_URI|${FULL_IMAGE}|g" /tmp/ssm-params.json

          echo "SSM params file content:"
          cat /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region "${{ env.REGION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for command to complete
          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --region "${{ env.REGION }}" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null)
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ env.INSTANCE_ID }}" \
                --region "${{ env.REGION }}" \
                --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text
              exit 1
            fi
            sleep 10
          done

      - name: Health check
        run: |
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://15.252.26.151/health || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i: Got HTTP $HTTP_CODE, retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: Deploy diagnostics
        if: always()
        run: |
          echo "=== Deployment Diagnostics ==="
          echo "GitHub SHA: ${{ github.sha }}"
          echo "ECR Registry: ${{ env.ECR_REGISTRY }}"
          echo "Repository: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$(echo ${{ github.sha }} | head -c 7)"
          echo "Instance ID: ${{ env.INSTANCE_ID }}"
          echo "Region: ${{ env.REGION }}"
          echo "Public URL: http://15.252.26.151"