name: deploy-deptic-api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/**'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic
  EC2_INSTANCE_ID: i-0edfdb0e7a6bdcda7
  CONTAINER_PORT: "8081"
  HEALTH_URL: http://3.7.135.174/health
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build:
    name: Build and Verify Go API
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/api/go.sum

      - name: Build diagnostics - toolchain and module verification
        working-directory: apps/api
        run: |
          set -euo pipefail
          echo "=== Go version ==="
          go version
          echo "=== go.mod module/go directive ==="
          head -n 5 go.mod
          echo "=== go mod verify ==="
          go mod verify
          echo "=== go vet ./... ==="
          go vet ./...
          echo "=== compile check ./... ==="
          go build ./...

      - name: Build server binary (cmd/server)
        working-directory: apps/api
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o /tmp/server ./cmd/server
          ls -lh /tmp/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_TAG="${GITHUB_RUN_ID}-${SHORT_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Building image: ${IMAGE_URI}"

      - name: Build Docker image (context apps/api, port 8081)
        working-directory: apps/api
        run: |
          set -euo pipefail
          docker build \
            --file Dockerfile \
            --tag "${IMAGE_URI}" \
            --tag "${ECR_REPOSITORY_URI}:latest" \
            .
          docker image inspect "${IMAGE_URI}" --format 'Image {{.Id}} size={{.Size}}'
          docker run --rm "${IMAGE_URI}" go version || true

      - name: Upload image tarball artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/image-artifact
          docker save "${IMAGE_URI}" "${ECR_REPOSITORY_URI}:latest" -o /tmp/image-artifact/deptic-api.tar
          ls -lh /tmp/image-artifact

      - uses: actions/upload-artifact@v4
        with:
          name: deptic-api-image
          path: /tmp/image-artifact/deptic-api.tar
          retention-days: 1

  deploy:
    name: Push to ECR and Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: deptic-api-image
          path: /tmp/image-artifact

      - name: Load Docker image
        run: |
          set -euo pipefail
          docker load -i /tmp/image-artifact/deptic-api.tar
          docker images

      - name: Authenticate to ECR with static credentials (AWS CLI)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "${{ needs.build.outputs.image_uri }}"
          docker push "${ECR_REPOSITORY_URI}:latest"
          aws ecr describe-images --region "$AWS_REGION" \
            --repository-name deptic \
            --image-ids imageTag="${{ needs.build.outputs.image_tag }}" \
            --query 'imageDetails[0].[imageTags[0],imageSizeInBytes,imagePushedAt]' --output table

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic:${IMAGE_TAG}",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always --name app -p 80:8081 --env-file /etc/deptic/env.file $IMAGE_URI"
            ]
          }
          SSMPARAMS
          sed -i "s|\${IMAGE_TAG}|${{ needs.build.outputs.image_tag }}|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Sent SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: ${STATUS}"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "SSM command failed with status ${STATUS}"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true
              exit 1
            fi
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

  verify:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Health check http://3.7.135.174/health (must return HTTP 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' http://3.7.135.174/health || true)
            echo "Attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "Health check never returned HTTP 200"
          exit 1