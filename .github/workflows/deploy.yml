name: Build & Deploy to EC2 Docker

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: deptic
  INSTANCE_ID: i-08f935b6a4864b593

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE:latest"
          docker build --build-arg NODE_VERSION=20 --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        if: ${{ env.INSTANCE_ID != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          AWS_REGION="ap-south-1"
          INSTANCE_ID="i-08f935b6a4864b593"
          ECR_REGISTRY="${ECR_REGISTRY:-696434672023.dkr.ecr.ap-south-1.amazonaws.com}"
          REPO="deptic"
          SECRET_ID="deptic/Deptic/secrets"
          FULL_IMAGE="$ECR_REGISTRY/$REPO:latest"
          TARGET_PORT="80"

          echo "==> Waiting for SSM agent on instance $INSTANCE_ID in $AWS_REGION..."
          PING="Offline"
          for i in $(seq 1 30); do
            PING=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)
            echo "SSM Ping [$i/30]: $PING"
            if [ "$PING" = "Online" ]; then
              break
            fi
            sleep 10
          done

          if [ "$PING" != "Online" ]; then
            echo "==> SSM agent never came online. Aborting deploy."
            exit 1
          fi

          # Write the SSM command to deploy the new image