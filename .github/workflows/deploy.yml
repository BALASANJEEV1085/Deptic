name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${ secrets.AWS_ACCESS_KEY_ID }
          aws-secret-access-key: ${ secrets.AWS_SECRET_ACCESS_KEY }
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t ${ steps.login-ecr.outputs.registry }/deptic:${{ github.sha }} .
          docker tag ${ steps.login-ecr.outputs.registry }/deptic:${{ github.sha }} ${ steps.login-ecr.outputs.registry }/deptic:latest
          docker push ${ steps.login-ecr.outputs.registry }/deptic:${{ github.sha }}
          docker push ${ steps.login-ecr.outputs.registry }/deptic:latest

      - name: Deploy to EC2 using SSM
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information --filters Key=InstanceIds,Values="i-03e057f4704a7fe71" --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "NotReady")
            [ "$STATUS" = "Online" ] && break
            echo "SSM not ready, waiting... ($i/30)"; sleep 10
          done

          COMMAND_ID=$(aws ssm send-command --instance-ids "i-03e057f4704a7fe71" --document-name "AWS-RunShellScript" --parameters 'commands=["until command -v docker > /dev/null 2>&1; do echo '\''waiting for docker'\''; sleep 5; done", "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${ steps.login-ecr.outputs.registry }", "docker pull ${ steps.login-ecr.outputs.registry }/deptic:latest", "docker stop app 2>/dev/null || true", "docker rm app 2>/dev/null || true", "docker run -d --restart always -p 80:80 --name app ${ steps.login-ecr.outputs.registry }/deptic:latest"]' --query "Command.CommandId" --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[0].Status" --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded."
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "Deployment failed."
              exit 1
            fi
            echo "Waiting for command to complete... ($i/30)"
            sleep 10
          done

          echo "Command did not complete in time."
          exit 1