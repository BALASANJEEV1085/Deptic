name: deptic-ec2-docker-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic
  EC2_INSTANCE_ID: i-0edfdb0e7a6bdcda7
  PUBLIC_URL: http://3.7.135.174
  CONTAINER_PORT: 80
  SECRETS_MANAGER_ID: deptic/Deptic/secrets

jobs:
  build-and-verify:
    name: Build diagnostics, web lint, CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repository layout diagnostics
        run: |
          set -euo pipefail
          echo "== repo root =="
          ls -la
          echo "== apps =="
          ls -la apps || true
          echo "== go.mod module =="
          head -n 5 apps/api/go.mod
          echo "== web package =="
          node -e "const p=require('./apps/web/package.json'); console.log(p.name, p.version, JSON.stringify(p.scripts))"
          echo "== cli package =="
          node -e "const p=require('./cli/package.json'); console.log(p.name, p.version, p.bin['deptic-scan'])"
          echo "== compose topology =="
          cat docker-compose.yml

      - name: Set up Go (api toolchain per go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Go build diagnostics (apps/api)
        working-directory: apps/api
        run: |
          set -euo pipefail
          go version
          go env GOVERSION GOPATH GOMODCACHE
          go mod download -x 2>&1 | tail -n 5 || true
          go build ./... && echo "GO_BUILD=OK"
          go vet ./... && echo "GO_VET=OK"

      - name: Set up Node.js (web + cli)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web install + lint (next.js 14)
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint && echo "WEB_LINT=OK"

      - name: CLI smoke test (deptic-scan)
        run: |
          set -euo pipefail
          node --check cli/index.js && echo "CLI_SYNTAX=OK"
          node --check cli/npm-package/bin/deptic-scan.js 2>/dev/null && echo "CLI_NPM_SYNTAX=OK" || echo "CLI_NPM_SYNTAX=SKIPPED (bin not present)"

  deploy-ec2-docker:
    name: Build image, push to ECR, deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static creds from repository secrets)
        run: |
          set -euo pipefail
          AWS_MASKED="${AWS_ACCESS_KEY_ID:0:4}"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "AWS credential prefix: ${AWS_MASKED}****"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: image
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_TAG="${SHORT_SHA}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "LATEST_IMAGE=$LATEST_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "Building image: $FULL_IMAGE (context: dockerfile_path=.)"

      - name: ECR login (direct AWS CLI, static credentials)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Build Docker image (repo-root context)
        run: |
          set -euo pipefail
          docker build -t "${FULL_IMAGE}" -t "${LATEST_IMAGE}" -f Dockerfile .
          docker images "${ECR_REGISTRY}/deptic" || true

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "${FULL_IMAGE}"
          docker push "${LATEST_IMAGE}"
          echo "PUSHED=${FULL_IMAGE}"

      - name: Write SSM command payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "export REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/deptic:${IMAGE_TAG}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          echo "SSM payload written:"
          cat /tmp/ssm-params.json

      - name: Deploy to EC2 via SSM send-command
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "attempt=$i status=$STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SSM_DEPLOY=SUCCESS"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::SSM command failed with status $STATUS"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" || true
              exit 1
            fi
            sleep 10
          done
          echo "::error::SSM command timed out"
          exit 1

      - name: Final health check (HTTP 200 required)
        run: |
          set -euo pipefail
          HEALTH_URL="${PUBLIC_URL}/health"
          echo "Probing $HEALTH_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "attempt=$i http_code=$CODE body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ]; then
              echo "HEALTH_CHECK=OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check never returned 200"
          exit 1